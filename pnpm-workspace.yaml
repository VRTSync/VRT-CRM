# ============================================================================
# SECURITY: Minimum release age for npm packages (supply-chain attack defense)
# Any npm package version must have been published for at least 1 day before
# pnpm will install it. Do not disable this setting.
# ============================================================================
minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - '@replit/*'

packages:
  - client
  - server
  - artifacts/*
